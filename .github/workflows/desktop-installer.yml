name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.0.0"
        required: true
        default: "1.0.0"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  LLAMA_CPP_TAG: "b12671"

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (-not $version) {
            $version = "${{ github.ref_name }}"
          }
          $version = $version.Trim().TrimStart("v", "V")
          if ($version -notmatch "^\d+\.\d+\.\d+$") {
            throw "Invalid release version: $version"
          }
          "VERSION=$version" >> $env:GITHUB_ENV
          "TAG=v$version" >> $env:GITHUB_ENV
          Write-Host "Building Pdf2zh Studio $version"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
          cache: pip
          cache-dependency-path: desktop/requirements-build.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r desktop\requirements-build.txt
          .\.venv\Scripts\python.exe -m pip install --no-deps googletrans==4.0.2

      - name: Prepare runtime resources
        shell: pwsh
        run: |
          $desktop = Join-Path $PWD "desktop"
          $resources = Join-Path $desktop "resources"
          $backendBin = Join-Path $resources "cuda-backend\bin"
          $backendVendor = Join-Path $resources "cuda-backend\vendor"
          New-Item -ItemType Directory -Path $backendBin, $backendVendor -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $resources "tessdata") -Force | Out-Null

          $base = "https://github.com/ggml-org/llama.cpp/releases/download/${{ env.LLAMA_CPP_TAG }}"
          $downloads = Join-Path $PWD "_downloads"
          New-Item -ItemType Directory -Path $downloads -Force | Out-Null
          $llamaZip = Join-Path $downloads "llama-cuda.zip"
          $cudartZip = Join-Path $downloads "cudart.zip"
          Invoke-WebRequest -Uri "$base/llama-${{ env.LLAMA_CPP_TAG }}-bin-win-cuda-12.4-x64.zip" -OutFile $llamaZip
          Invoke-WebRequest -Uri "$base/cudart-llama-bin-win-cuda-12.4-x64.zip" -OutFile $cudartZip

          $llamaDir = Join-Path $downloads "llama"
          $cudartDir = Join-Path $downloads "cudart"
          Expand-Archive -Path $llamaZip -DestinationPath $llamaDir -Force
          Expand-Archive -Path $cudartZip -DestinationPath $cudartDir -Force

          $server = Get-ChildItem $llamaDir -Recurse -Filter "llama-server.exe" | Select-Object -First 1
          if (-not $server) { throw "llama-server.exe was not found in the llama.cpp package" }
          Copy-Item (Join-Path $server.Directory.FullName "*") $backendBin -Recurse -Force
          Get-ChildItem $cudartDir -Recurse -Filter "*.dll" | ForEach-Object {
            Copy-Item $_.FullName $backendVendor -Force
            Copy-Item $_.FullName $backendBin -Force
          }

          $doclayout = & .\.venv\Scripts\python.exe -c "from babeldoc.assets.assets import get_doclayout_onnx_model_path; print(get_doclayout_onnx_model_path())"
          if (-not (Test-Path $doclayout)) { throw "doclayout.onnx cache was not created" }
          Copy-Item $doclayout (Join-Path $resources "doclayout.onnx") -Force

          $tessdata = Join-Path $resources "tessdata"
          $tessBase = "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/4.1.0"
          Invoke-WebRequest -Uri "$tessBase/eng.traineddata" -OutFile (Join-Path $tessdata "eng.traineddata")
          Invoke-WebRequest -Uri "$tessBase/chi_sim.traineddata" -OutFile (Join-Path $tessdata "chi_sim.traineddata")

      - name: Compile desktop application
        shell: pwsh
        working-directory: desktop
        run: |
          ..\.venv\Scripts\python.exe -m py_compile app\main.py app\studio.py app\translator.py app\translation_worker.py
          ..\.venv\Scripts\python.exe -m PyInstaller --noconfirm --clean Pdf2zhStudio.spec

      - name: Run packaged tests
        shell: pwsh
        working-directory: desktop
        run: |
          ..\.venv\Scripts\python.exe -c "import fitz; d=fitz.open(); p=d.new_page(); p.insert_text((72,72),'Pdf2zh Studio self test'); d.save('test-sample.pdf')"
          $exe = Join-Path $PWD "dist\Pdf2zhStudio\Pdf2zhStudio.exe"
          & $exe --self-test
          & $exe --self-test-bridge (Join-Path $PWD "dist\bridge-report.json")
          Remove-Item "test-sample.pdf" -Force

      - name: Build installer
        shell: pwsh
        working-directory: desktop
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DMyAppVersion=$env:VERSION" "installer\Pdf2zhStudio.iss"
          $installer = Join-Path $PWD "dist\installer\Pdf2zhStudio-Setup-$env:VERSION-x64.exe"
          if (-not (Test-Path $installer)) { throw "Installer was not created: $installer" }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $installer -Leaf)" | Set-Content (Join-Path $PWD "dist\installer\SHA256SUMS.txt") -Encoding ascii

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pdf2zhStudio-Setup-Windows-x64
          path: |
            desktop/dist/installer/*.exe
            desktop/dist/installer/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Pdf2zh Studio V${{ env.VERSION }}
          body_path: desktop/RELEASE_NOTES.md
          files: |
            desktop/dist/installer/Pdf2zhStudio-Setup-${{ env.VERSION }}-x64.exe
            desktop/dist/installer/SHA256SUMS.txt
          draft: false
          prerelease: false
          make_latest: true

